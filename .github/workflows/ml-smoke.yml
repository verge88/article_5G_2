name: ml-smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  pytorch-geometric:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and PyG
        run: pip install -e ".[dev]" torch-geometric scikit-learn
      - name: Run PyG smoke test
        run: pytest tests/test_pyg_smoke.py -q
