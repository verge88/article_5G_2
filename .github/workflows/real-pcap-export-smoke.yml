name: real-pcap-export-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/fedsiggraph-v1"
    paths:
      - ".github/workflows/real-pcap-export-smoke.yml"

jobs:
  open5gs-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tshark
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y tshark

      - name: Install FedSigGraph PCAP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pcap,dev]"

      - name: Download published Open5GS fuzz captures
        run: |
          mkdir -p experiments/pcap-real-smoke/raw
          for suffix in a b c d e f g h; do
            name="007${suffix}-fuzz-open5gs.pcapng"
            curl -L --fail \
              "https://raw.githubusercontent.com/DLTeamTUC/5GDatasets/main/pcap/${name}" \
              -o "experiments/pcap-real-smoke/raw/${name}"
          done

      - name: Probe protocol and causal-context coverage
        run: |
          python scripts/probe_pcap_dataset.py \
            --pcaps experiments/pcap-real-smoke/raw/*.pcapng \
            --output-dir experiments/pcap-real-smoke/correlated \
            --deployment-prefix dltuc-open5gs-fuzz \
            --output-json experiments/pcap-real-smoke/coverage.json

          echo '## DLTeamTUC Open5GS fuzz PCAP coverage' >> "$GITHUB_STEP_SUMMARY"
          cat experiments/pcap-real-smoke/coverage.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and correlated exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dltuc-open5gs-fuzz-coverage
          path: experiments/pcap-real-smoke/
          retention-days: 30
