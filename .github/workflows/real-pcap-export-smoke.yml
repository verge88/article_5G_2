name: real-pcap-export-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/fedsiggraph-v1"
    paths:
      - ".github/workflows/real-pcap-export-smoke.yml"

jobs:
  open5gs-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tshark
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y tshark

      - name: Install FedSigGraph PCAP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pcap,dev]"

      - name: Download real Open5GS fuzz capture
        run: |
          mkdir -p experiments/pcap-real-smoke
          curl -L --fail \
            https://raw.githubusercontent.com/DLTeamTUC/5GDatasets/main/pcap/007c-fuzz-open5gs.pcapng \
            -o experiments/pcap-real-smoke/007c-fuzz-open5gs.pcapng

      - name: Export causally correlated signaling
        run: |
          python scripts/export_correlated_pcap.py \
            --pcap experiments/pcap-real-smoke/007c-fuzz-open5gs.pcapng \
            --output experiments/pcap-real-smoke/007c-correlated.csv \
            | tee experiments/pcap-real-smoke/export_counts.json

      - name: Inspect canonical event coverage
        run: |
          python - <<'PY' | tee experiments/pcap-real-smoke/coverage.json
          import json
          from collections import Counter
          from fedsiggraph.data import SignalingParserAdapter

          events = SignalingParserAdapter(
              "dltuc-open5gs-007c"
          ).from_csv(
              "experiments/pcap-real-smoke/007c-correlated.csv",
              label=1,
              attack_type="malformed_nas_fuzz",
          )

          payload = {
              "events": len(events),
              "protocols": dict(Counter(e.protocol for e in events)),
              "with_ue_context": sum(
                  e.ue_context is not None for e in events
              ),
              "with_session_context": sum(
                  e.session_context is not None for e in events
              ),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          echo '## Real PCAP causal export' >> "$GITHUB_STEP_SUMMARY"
          cat experiments/pcap-real-smoke/coverage.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload correlated export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dltuc-open5gs-007c-correlated
          path: experiments/pcap-real-smoke/
          retention-days: 30
