name: granomaly-real-ablation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/fedsiggraph/models/**"
      - "src/fedsiggraph/training/**"
      - "src/fedsiggraph/data/granomaly.py"
      - "scripts/prepare_granomaly.py"
      - "scripts/run_ablation.py"
      - "scripts/run_granomaly_suite.py"
      - ".github/workflows/granomaly-real-ablation.yml"

concurrency:
  group: granomaly-real-ablation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nrf-smf-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU ML stack
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" torch-geometric scikit-learn

      - name: Run compact real-data ablation
        run: |
          python scripts/run_granomaly_suite.py \
            --workspace experiments/granomaly-ci \
            --experiments nrf smf \
            --models numeric_tgn semantic_tgn temporal_heat \
            --seeds 1 \
            --epochs 2 \
            --batch-size 1024 \
            --neighbors 16 \
            --test-memory safe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granomaly-real-ablation
          path: |
            experiments/granomaly-ci/raw/source_manifest.json
            experiments/granomaly-ci/prepared/*/manifest.json
            experiments/granomaly-ci/results/*/*.json
            experiments/granomaly-ci/suite_summary.json
